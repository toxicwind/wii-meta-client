name: Build Wii Meta-Client (libogc2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/extremscorner/libogc2:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with libogc2
        run: |
          # libogc2 uses different include paths
          sed -i 's|include $(DEVKITPPC)/wii_rules|include $(DEVKITPRO)/libogc2/wii_rules|' Makefile
          make clean || true
          make

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wii-meta-client-libogc2
          path: '*.dol'
